{% extends "cards/base_cards.html" %}
{% block content %}
    <div class="auth-wrap">
        <section class="auth-panel">
            <p class="eyebrow">ACCOUNT SECURITY</p>
            <h1>Change password</h1>
            <p class="auth-intro">Enter your current password, then choose a new one.</p>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Change password</button>
            </form>
            <p class="auth-switch"><a href="{% url 'account-settings' %}">Back to account settings</a></p>
        </section>
    </div>
{% endblock %}
